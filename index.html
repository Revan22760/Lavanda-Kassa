<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mağaza Kassası</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-v="sell">
<div id="top">
<header><h1 id="title">Mağaza Kassası</h1><span id="net" class="pill">Onlayn</span></header>
<nav>
  <button data-v="sell" onclick="go('sell')"><i>🛒</i>Satış</button>
  <button data-v="prod" onclick="go('prod')"><i>📦</i>Məhsullar</button>
  <button data-v="rep" onclick="go('rep')"><i>📊</i>Hesabat</button>
  <button data-v="set" onclick="go('set')"><i>⚙️</i>Parametrlər</button>
</nav>
<div id="paybar"><div><small>Cəmi</small><b id="tot">0,00 ₼</b></div><button id="pay" class="btn" onclick="payModal()" disabled>Ödənişə keç</button></div>
<div id="lbar"></div></div>
<main>
  <section id="v-sell" class="view on">
    <div class="bar" style="margin-bottom:8px"><button id="sel" class="chip" onclick="sellerModal()"></button><button class="chip" onclick="custList()">📒 Nisyə dəftəri</button></div>
    <div class="bar"><input id="q" placeholder="Barkod və ya məhsul adı" autocomplete="off" enterkeyhint="done"><button class="ic" onclick="openScan('sell')" aria-label="Barkod skan et">📷</button></div>
    <div id="sug"></div>
    <div id="qs"></div>
    <div id="cartl"></div>
  </section>
  <section id="v-prod" class="view">
    <div class="bar"><input id="pq" placeholder="Axtarış: ad və ya barkod" oninput="rProd()" autocomplete="off"><button class="ic" onclick="openScan('search')" aria-label="Barkod skan et">📷</button><button class="ic" onclick="editProduct()" aria-label="Yeni məhsul">+</button></div>
    <div id="plist"></div>
  </section>
  <section id="v-rep" class="view"></section>
  <section id="v-set" class="view"></section>
</main>
<div id="scan"><video id="vid" playsinline muted></video><div class="frame"></div><div id="smsg"></div><div id="spanel"></div><button id="sx" onclick="closeScan()" aria-label="Bağla">✕</button></div>
<div id="lock"></div>
<div id="mdl" onclick="if(event.target===this)closeModal()"><div id="sheet"></div></div>
<div id="tst"></div>
<div id="prn"></div>
<script src="app.js"></script>
</body>
</html>
